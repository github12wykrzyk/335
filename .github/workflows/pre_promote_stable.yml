name: Pre-promote 335 stable
on:
  push:
    branches: ['promote/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: python tools/verify_repo.py
      - run: python tools/verify_current.py
      - run: python -m unittest discover -s tests -v
      - name: Exact-byte runtime gate
        run: python tools/package_candidate.py --package dist/WoW335_STABLE_CANDIDATE.zip --metadata dist/candidate_metadata.json
      - run: python tools/verify_candidate_package.py --package dist/WoW335_STABLE_CANDIDATE.zip --metadata dist/candidate_metadata.json --finalize
