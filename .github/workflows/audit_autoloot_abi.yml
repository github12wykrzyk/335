name: Audit exact 12340 AutoLoot ABI candidates
on:
  push:
    branches: ['feature/autoloot-12340']
    paths:
      - 'tools/audit_autoloot_abi.py'
      - '.github/workflows/audit_autoloot_abi.yml'
      - 'runtime/client_exe_target.json'
      - 'Wow.exe'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi-evidence:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disassembler for read-only binary audit
        run: python -m pip install capstone==5.0.6
      - name: Audit exact selected client
        run: python tools/audit_autoloot_abi.py --exe Wow.exe --out dist/autoloot_abi.json
      - name: Save read-only exact-client disassembly report
        uses: actions/upload-artifact@v4
        with:
          name: AutoLoot12340-ABI-candidates-${{ github.sha }}
          path: dist/autoloot_abi.json
          if-no-files-found: error
