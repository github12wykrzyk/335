name: Audit ConsoleXP reference and ESP core
on:
  workflow_dispatch:
  push:
    branches: [work, 'feature/**']
    paths:
      - 'reference/ConsoleXP/**'
      - 'tools/audit_consolexp_reference.py'
      - 'tests/test_consolexp_reference_audit.py'
      - 'src/PlayerESP/**'
      - 'tests/player_esp_core_harness.c'
      - 'tests/player_esp_camera_harness.c'
      - 'tests/test_player_esp_camera.py'
      - 'tests/test_player_esp_render.py'
      - 'tests/test_player_esp_lua.py'
      - 'tests/player_esp_scanner_harness.c'
      - 'tests/test_player_esp_scanner.py'
      - 'tests/test_player_esp_core.py'
      - 'tests/test_player_esp_win32_host.py'
      - 'tools/verify_esp_native.py'
      - 'tools/audit_player_esp_client.py'
      - 'tests/test_esp_client_audit.py'
      - 'docs/CONSOLEXP_REFERENCE_ESP.md'
      - '.github/workflows/consolexp_reference_esp.yml'
  pull_request:
    branches: [work]
permissions:
  contents: read
jobs:
  reference-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate uploaded archive identity and CRC without executing binaries
        run: python tools/audit_consolexp_reference.py --report dist/consolexp_reference_audit.json
      - name: Audit camera/object reference VAs against exact selected Wow.exe
        run: python tools/audit_player_esp_client.py --report dist/esp_client_static_audit.json
      - name: Print exact-client camera candidate evidence (NOT validated ABI)
        run: |
          python -c "import json; d=json.load(open('dist/esp_client_static_audit.json')); [print(r['id'],r['va'],'code:',r.get('first_64_bytes'),'xrefs:',r.get('executable_immediate_xrefs')) for r in d['candidates'] if r['id'] in ('world_frame_pointer','world_frame_alternative','get_active_camera')]"
      - name: Inspect exact-client native camera and projection neighborhood
        run: |
          objdump -d -M intel --start-address=0x004f58c0 --stop-address=0x004f5a20 Wow.exe | head -n 100
          objdump -d -M intel --start-address=0x004f65e0 --stop-address=0x004f6950 Wow.exe | head -n 260
      - name: Print native 112 W2S signature port leads (NOT callable ABI)
        run: |
          python -c "import json;d=json.load(open('dist/esp_client_static_audit.json'));print(json.dumps(d['reference_112_native_pattern_leads'],indent=2))"
      - name: Test reference safety and portable ESP core
        run: python -m unittest discover -s tests -p 'test_consolexp_reference_audit.py' -v && python -m unittest discover -s tests -p 'test_player_esp_core.py' -v && python -m unittest discover -s tests -p 'test_player_esp_scanner.py' -v && python -m unittest discover -s tests -p 'test_player_esp_win32_host.py' -v && python -m unittest discover -s tests -p 'test_esp_client_audit.py' -v && python -m unittest discover -s tests -p 'test_player_esp_camera.py' -v && python -m unittest discover -s tests -p 'test_player_esp_render.py' -v && python -m unittest discover -s tests -p 'test_player_esp_lua.py' -v
      - name: Publish inert reference inventory (not game package)
        uses: actions/upload-artifact@v4
        with:
          name: consolexp-reference-audit-${{ github.sha }}
          path: |
            dist/consolexp_reference_audit.json
            dist/esp_client_static_audit.json
          if-no-files-found: error
  esp-core-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run ESP portable logic with MSVC x86 (not a game DLL)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /TC /Fe:tests\player_esp_core_harness.exe src\PlayerESP\player_esp_core.c tests\player_esp_core_harness.c
          if errorlevel 1 exit /b 1
          tests\player_esp_core_harness.exe
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /TC /Fe:tests\player_esp_scanner_harness.exe src\PlayerESP\player_esp_core.c src\PlayerESP\player_esp_scanner.c tests\player_esp_scanner_harness.c
          if errorlevel 1 exit /b 1
          tests\player_esp_scanner_harness.exe
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /TC /Fe:tests\player_esp_camera_harness.exe src\PlayerESP\player_esp_core.c src\PlayerESP\player_esp_camera.c tests\player_esp_camera_harness.c
          if errorlevel 1 exit /b 1
          tests\player_esp_camera_harness.exe
          if errorlevel 1 exit /b 1
      - name: Build real x86 diagnostic host DLL, NOT_GAME_PACKAGE
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist dist\esp-native mkdir dist\esp-native
          cl /nologo /LD /O2 /W4 /WX /TC /Brepro /Fo:dist\esp-native\ /Fe:dist\esp-native\PlayerESP335.dll src\PlayerESP\player_esp_core.c src\PlayerESP\player_esp_scanner.c src\PlayerESP\player_esp_camera.c src\PlayerESP\player_esp_d3d9.c src\PlayerESP\player_esp_lua.c src\PlayerESP\player_esp_win32_host.c /link /MACHINE:X86 /Brepro Advapi32.lib User32.lib d3d9.lib
          if errorlevel 1 exit /b 1
          dumpbin /exports dist\esp-native\PlayerESP335.dll > dist\esp-native\exports.txt
          if errorlevel 1 exit /b 1
          python tools\verify_esp_native.py --dll dist\esp-native\PlayerESP335.dll --exports dist\esp-native\exports.txt --report dist\esp-native\report.json
          if errorlevel 1 exit /b 1
      - name: Publish build attestation only (not the DLL), NOT_GAME_PACKAGE
        uses: actions/upload-artifact@v4
        with:
          name: esp335-native-build-report-NOT_GAME_PACKAGE
          path: dist/esp-native/report.json
          if-no-files-found: error
