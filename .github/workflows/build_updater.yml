name: Build 335 updater

on:
  push:
    branches:
      - work
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-wow335-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-updater:
    if: github.ref_name == 'work'
    runs-on: windows-2022
    steps:
      - name: Checkout current tree
        uses: actions/checkout@v5

      - name: Verify repository, runtime, module contracts and unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_module_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned EXE identity embedded in updater
        shell: pwsh
        run: |
          @'
          import json, re
          from pathlib import Path
          target=json.loads(Path("runtime/client_exe_target.json").read_text(encoding="utf-8"))
          code=Path("tools/updater/UpdaterSafety.cs").read_text(encoding="utf-8")
          match=re.search(r'PinnedClientSha256\s*=\s*"([0-9a-f]{64})"', code)
          if match is None or match.group(1)!=target["sha256"]: raise SystemExit("Updater pinned EXE differs from manifest")
          print("UPDATER_PIN: PASS")
          '@ | python -
      - name: Bind addon resources to exact updater commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          [IO.File]::WriteAllText('dist/autoloot_diag_sha.txt', '${{ github.sha }}', [Text.Encoding]::ASCII)

      - name: Compile embedded x86 manifest-driven game-thread loader
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          if not exist dist mkdir dist
          cl /nologo /W4 /WX /O2 /TC /Fe:dist\WoW335RuntimeLoader.exe src\Loader\loader_win32.c /link /MACHINE:X86 /Brepro User32.lib /SUBSYSTEM:WINDOWS /ENTRY:wmainCRTStartup
          if errorlevel 1 exit /b 1

      - name: Compile WinForms updater and bootstrap x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio/MSBuild installation not found" }
          $csc = Join-Path $vs 'MSBuild\Current\Bin\Roslyn\csc.exe'
          if (-not (Test-Path $csc)) { throw "Roslyn csc.exe not found: $csc" }
          $ref = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          if (-not (Test-Path $ref)) { throw ".NET Framework 4.8 reference assemblies not found" }

          & $csc /nologo /target:winexe /platform:x86 /optimize+ /langversion:latest `
            /win32icon:tools\updater\assets\WoW335_ice.ico `
            /out:dist\WoW335UpdaterBootstrap.exe `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            tools\updater\UpdaterBootstrap.cs
          if ($LASTEXITCODE -ne 0) { throw "bootstrap csc failed with exit code $LASTEXITCODE" }

          & $csc /nologo /target:winexe /platform:x86 /optimize+ /langversion:latest `
            /out:dist\WoW335Updater.exe `
            /win32icon:tools\updater\assets\WoW335_ice.ico `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            /reference:"$ref\System.Drawing.dll" `
            /reference:"$ref\System.Windows.Forms.dll" `
            /reference:"$ref\System.Net.Http.dll" `
            /reference:"$ref\System.IO.Compression.dll" `
            /reference:"$ref\System.IO.Compression.FileSystem.dll" `
            /reference:"$ref\System.Security.dll" `
            /reference:"$ref\System.Web.Extensions.dll" `
            /resource:src\AutoLoot\diagnostics\WoW335AutoLootDiag\WoW335AutoLootDiag.lua,AutoLootDiag.WoW335AutoLootDiag.lua `
            /resource:src\AutoLoot\diagnostics\WoW335AutoLootDiag\WoW335AutoLootDiag.toc,AutoLootDiag.WoW335AutoLootDiag.toc `
            /resource:dist\autoloot_diag_sha.txt,AutoLootDiag.SourceCommit.txt `
            /resource:dist\WoW335RuntimeLoader.exe,WoW335Runtime.Loader.exe `
            tools\updater\WoW335Updater.cs `
            tools\updater\Updater335Dashboard.cs `
            tools\updater\Updater335GitHubMonitor.cs `
            tools\updater\UpdaterSafety.cs `
            tools\updater\UpdaterNetworkCompat.cs `
            tools\updater\UpdaterProcessGuard.cs `
            tools\updater\UpdaterGameProcessGuard.cs `
            tools\updater\UpdaterRealmlistFeature.cs `
            tools\updater\UpdaterMaintenanceFeature.cs `
            tools\updater\UpdaterIssueReportFeature.cs `
            tools\updater\UpdaterAutoLootDiagFeature.cs `
            tools\updater\UpdaterAutoLootRuntimeFeature.cs
          if ($LASTEXITCODE -ne 0) { throw "updater csc failed with exit code $LASTEXITCODE" }

      - name: Verify updater PE32 x86 and hashes
        shell: pwsh
        run: |
          @'
          import hashlib, json, re, struct
          from pathlib import Path

          def inspect(path):
              p = Path(path)
              data = p.read_bytes()
              if data[:2] != b'MZ':
                  raise SystemExit(f'{p}: not an MZ executable')
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              if data[pe:pe+4] != b'PE\0\0':
                  raise SystemExit(f'{p}: missing PE signature')
              machine = struct.unpack_from('<H', data, pe + 4)[0]
              if machine != 0x014C:
                  raise SystemExit(f'{p}: expected x86 machine 0x014C, got 0x{machine:04X}')
              return data, machine

          version_source = Path('tools/updater/UpdaterSafety.cs').read_text(encoding='utf-8')
          match = re.search(r'public const string Version\s*=\s*"([^"]+)"', version_source)
          if not match:
              raise SystemExit('UpdaterBuildInfo.Version not found')
          updater_version = match.group(1)

          launcher = Path('dist/WoW335RuntimeLoader.exe')
          loader_data, loader_machine = inspect(launcher)
          if struct.unpack_from('<H', loader_data, struct.unpack_from('<I', loader_data, 0x3C)[0] + 24)[0] != 0x10B:
              raise SystemExit('Universal runtime loader must be PE32 x86')
          if 'dlls.txt'.encode('utf-16le') not in loader_data or b'W335_MessageId' not in loader_data:
              raise SystemExit('Universal loader lacks manifest or module ABI')
          print('Embedded universal runtime loader PE32 x86: PASS', hashlib.sha256(loader_data).hexdigest())

          updater = Path('dist/WoW335Updater.exe')
          bootstrap = Path('dist/WoW335UpdaterBootstrap.exe')
          updater_data, updater_machine = inspect(updater)
          bootstrap_data, bootstrap_machine = inspect(bootstrap)
          icon = Path('tools/updater/assets/WoW335_ice.ico').read_bytes()
          if len(icon) < 32 or icon[:6] != bytes((0, 0, 1, 0, 1, 0)):
              raise SystemExit('Invalid WoW335_ice.ico header')
          icon_size = struct.unpack_from('<I', icon, 14)[0]
          icon_offset = struct.unpack_from('<I', icon, 18)[0]
          if icon_offset + icon_size != len(icon):
              raise SystemExit('Invalid WoW335_ice.ico image length')
          icon_image = icon[icon_offset:]
          if not icon_image.startswith(bytes((137, 80, 78, 71, 13, 10, 26, 10))):
              raise SystemExit('WoW335_ice.ico must contain the verified ice icon PNG')
          for binary, binary_data in ((updater, updater_data), (bootstrap, bootstrap_data)):
              if icon_image not in binary_data:
                  raise SystemExit(f'{binary}: ice icon resource not embedded in PE')
          print('Embedded ice icon: PASS')
          meta = {
              'native_loader_sha256': hashlib.sha256(loader_data).hexdigest(),
              'name': updater.name,
              'updater_version': updater_version,
              'self_update_protocol': 1,
              'sha256': hashlib.sha256(updater_data).hexdigest(),
              'size': len(updater_data),
              'pe_machine': f'0x{updater_machine:04X}',
              'bootstrap_name': bootstrap.name,
              'bootstrap_sha256': hashlib.sha256(bootstrap_data).hexdigest(),
              'bootstrap_size': len(bootstrap_data),
              'bootstrap_pe_machine': f'0x{bootstrap_machine:04X}',
              'git_sha': '${{ github.sha }}',
              'channel': '${{ github.ref_name }}',
          }
          Path('dist/updater_build.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          '@ | python -

      - name: Verify universal loader PE32 and manifest launch gates
        shell: pwsh
        run: |
          & "$env:windir\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools\updater\tests\AutoLootRuntimeSmoke.ps1 -UpdaterExe dist\WoW335Updater.exe -LoaderExe dist\WoW335RuntimeLoader.exe
          if ($LASTEXITCODE -ne 0) { throw "Native AutoLoot embedded loader verification failed" }

      - name: Verify compact WinForms dashboard geometry and tool drawer
        shell: pwsh
        run: |
          & "$env:windir\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools\\updater\\tests\\DashboardLayoutSmoke.ps1 -UpdaterExe dist\\WoW335Updater.exe
          if ($LASTEXITCODE -ne 0) { throw "Compact updater dashboard smoke failed" }

      - name: Verify exact-SHA addon resources, SavedVariables parser and installation fail-closed
        shell: pwsh
        run: |
          & "$env:windir\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools\updater\tests\AutoLootDiagSmoke.ps1 -UpdaterExe dist\WoW335Updater.exe -ExpectedSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw "AutoLoot diagnostic updater smoke test failed" }

      - name: Verify update closes the selected game only
        shell: pwsh
        run: |
          & "$env:windir\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tools\updater\tests\UpdateClosesGameSmoke.ps1 -UpdaterExe dist\WoW335Updater.exe
          if ($LASTEXITCODE -ne 0) { throw "Game shutdown updater smoke test failed" }

      - name: Copy updater README
        shell: pwsh
        run: Copy-Item tools\updater\README.md dist\README_UPDATER.md

      - name: Reject outdated branch HEAD before uploading updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = git ls-remote --exit-code origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw 'Unable to verify current remote branch HEAD' }
          $actual = (($remote -split '\s+')[0]).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "STALE_HEAD: $env:GITHUB_REF_NAME is now $actual, this run checked out $env:GITHUB_SHA"
          }
          Write-Host "CURRENT_HEAD: PASS $actual"

      - name: Upload the only canonical updater for all game branches
        uses: actions/upload-artifact@v4
        with:
          name: WoW335Updater-${{ github.sha }}
          path: |
            dist/WoW335Updater.exe
            dist/WoW335UpdaterBootstrap.exe
            dist/updater_build.json
            dist/README_UPDATER.md
          if-no-files-found: error
          compression-level: 0


      - name: Delete obsolete updater artifacts across branches
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 'WoW335Updater-${{ github.sha }}';
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            let removed = 0;
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith('WoW335Updater-') || artifact.name === keep) continue;
              await github.rest.actions.deleteArtifact({
                ...context.repo, artifact_id: artifact.id
              });
              core.info('Removed obsolete updater: ' + artifact.name + ' / ' + artifact.id);
              removed++;
            }
            core.info('UPDATER_ARTIFACT_PRUNE: PASS; kept ' + keep + '; removed ' + removed);
