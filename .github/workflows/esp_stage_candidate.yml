name: Stage PlayerESP visual TEST candidate
on:
  push:
    branches: [feature/player-esp-12340]
    paths:
      - 'src/PlayerESP/**'
      - 'tools/stage_esp_candidate.py'
      - 'tests/test_autoloot_normal_runtime.py'
      - 'tests/test_updater_autoloot_delivery.py'
      - 'tools/verify_module_registry.py'
      - '.github/workflows/esp_stage_candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: player-esp-stage
  cancel-in-progress: true
jobs:
  stage-and-register:
    if: github.ref_name == 'feature/player-esp-12340'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight current exact client and feature HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'STALE_CHECKOUT' }
          python tools/verify_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual ESP PE32 x86 using pinned toolchain and register
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/stage_esp_candidate.py --stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_module_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_active.py --all --report dist/esp-staged-native-build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit exact DLL and manifest only after all checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = git ls-remote --exit-code origin refs/heads/feature/player-esp-12340
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw 'REMOTE_HEAD_MISSING' }
          $actual = (($remote -split '\s+')[0]).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "STALE_BRANCH $actual" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_INDEX.json runtime/current.json runtime/module_registry.json
          git add -f runtime/PlayerESP335.dll
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "build(esp): register exact PE32 x86 visual TEST runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feature/player-esp-12340
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "ESP_REGISTERED_HEAD: $((git rev-parse HEAD).Trim())"
      - name: Request canonical candidate workflow for the new exact SHA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ ref = "feature/player-esp-12340" } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/github12wykrzyk/335/actions/workflows/build_work_candidate.yml/dispatches" -Method POST -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "ESP_PACKAGE: dispatched canonical exact-SHA build; no package claimed yet"
