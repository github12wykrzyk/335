name: Read-only packet ABI audit (exact 12340)
on:
  workflow_dispatch:
  push:
    branches: [feature/autopickpocket-packets-12340]
    paths:
      - tools/audit_pp_packet_12340.py
      - .github/workflows/audit_pp_packets.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install disassembler
        run: python -m pip install capstone==5.0.6
      - name: Audit exact pinned client without patching
        run: python tools/audit_pp_packet_12340.py
