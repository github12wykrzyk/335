name: Activate isolated packet AutoPickPocket on 12340 native x86
on:
  workflow_dispatch:
  push:
    branches: [feature/autopickpocket-packets-12340]
    paths:
      - 'src/AutoPickPocket/**'
      - 'tools/register_autopickpocket.py'
      - '.github/workflows/activate_autopickpocket.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: pp-native-register-${{ github.ref }}
  cancel-in-progress: true
jobs:
  register-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source baseline and exact pinned WoW 12340
        shell: pwsh
        run: |
          python tools/verify_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_client_exe.py --exe Wow.exe --require-target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python src/AutoPickPocket/audit_spell_abi.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python src/AutoPickPocket/audit_lua_result_abi.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python src/AutoPickPocket/audit_npc_type_12340.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build PP using pinned MSVC x86 and register exact binary with universal loader
        shell: pwsh
        run: |
          python tools/register_autopickpocket.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_module_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_active.py --all --report dist/native_build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm PP native exports and PE32 x86
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin=Join-Path $vs 'VC\Tools\MSVC'
          $found=Get-ChildItem -Path $dumpbin -Filter dumpbin.exe -Recurse | Where-Object FullName -match 'Hostx64.x86|Hostx86.x86' | Select-Object -First 1
          if (-not $found) { throw 'Missing Windows x86 dumpbin' }
          $exports=& $found.FullName /exports runtime\AutoPickPocket335.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('W335_MessageId','W335_HookProc','W335_CallWndProc','PP335_VerifiedPolicyV1')) {
            if (-not ($exports | Select-String -SimpleMatch $name)) { throw "Missing native x86 export $name" }
          }
      - name: Commit only exact built PP game module and ownership on feature branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $remote=git ls-remote --exit-code origin refs/heads/feature/autopickpocket-packets-12340
          if ($LASTEXITCODE -ne 0 -or (-split $remote)[0] -ne $env:GITHUB_SHA) { throw 'STALE_HEAD: PP registration aborted' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_INDEX.json runtime/current.json runtime/module_registry.json
          git add -f runtime/AutoPickPocket335.dll
          git commit -m 'build(pp): register exact PE32 x86 module in universal loader stack'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feature/autopickpocket-packets-12340
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $registered=(git rev-parse HEAD).Trim()
          Write-Host "REGISTERED_NATIVE_PP_SHA=$registered"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'X-GitHub-Api-Version'='2022-11-28';Accept='application/vnd.github+json'}
          $url='https://api.github.com/repos/github12wykrzyk/335/actions/workflows/build_work_candidate.yml/dispatches'
          Invoke-RestMethod -Method Post -Uri $url -Headers $headers -Body '{"ref":"feature/autopickpocket-packets-12340"}' -ContentType 'application/json'
          Write-Host 'Dispatched exact-HEAD full game-package gate (no updater published on feature).'
